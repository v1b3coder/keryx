name: Build APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for the release (e.g. v0.6.0); tag pushes use the pushed tag'
        required: true

permissions:
  contents: write

env:
  # The release certificate (app/plugins/withAndroidReleaseSigning.js). A mismatch
  # means the APK cannot update an install made by an earlier release.
  EXPECTED_CERT_SHA256: 'f6051a67f984ad86b926ee41edb3e9a4fad257e005135eb88fd9f74b9eb5645f'

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'  # the Android Gradle Plugin used by Expo SDK 57

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('app/package-lock.json', 'app/app.json') }}

      - name: Install npm dependencies
        working-directory: app
        run: npm ci

      # app/android is generated (app/.gitignore): the release signing config
      # comes from app/plugins/withAndroidReleaseSigning.js.
      - name: Generate the Android project
        working-directory: app
        run: npx expo prebuild --platform android --no-install

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="${{ inputs.version }}"
          fi
          VERSION="$(node -p "require('./app/app.json').expo.version")"
          if [[ "$TAG" != "v$VERSION" ]]; then
            echo "::error::tag $TAG does not match app/app.json version $VERSION"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Decode the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KERYX_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keryx-release.jks"

      - name: Build release APK
        working-directory: app/android
        env:
          KERYX_KEYSTORE_FILE: ${{ runner.temp }}/keryx-release.jks
          KERYX_KEYSTORE_PASSWORD: ${{ secrets.KERYX_KEYSTORE_PASSWORD }}
          KERYX_KEY_ALIAS: ${{ secrets.KERYX_KEY_ALIAS }}
          KERYX_KEY_PASSWORD: ${{ secrets.KERYX_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Verify the release signature
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --print-certs \
            app/android/app/build/outputs/apk/release/app-release.apk \
            | grep -q "certificate SHA-256 digest: $EXPECTED_CERT_SHA256"

      - name: Stage APK
        run: |
          mkdir -p dist-apk
          cp app/android/app/build/outputs/apk/release/app-release.apk \
            "dist-apk/keryx-${{ steps.version.outputs.version }}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Keryx ${{ steps.version.outputs.version }}
          files: dist-apk/*.apk
          generate_release_notes: true
